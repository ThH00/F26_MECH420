{%- comment -%}
  Embeds a YouTube video (standard YouTube player, shows the video title).
  Usage in any page:
    {% include youtube.html id="VIDEO_ID" %}
  The VIDEO_ID is the part after youtu.be/ (or after watch?v=).
{%- endcomment -%}
<div class="yt">
  <iframe src="https://www.youtube.com/embed/{{ include.id }}" title="{{ include.title | default: 'YouTube video player' }}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>
