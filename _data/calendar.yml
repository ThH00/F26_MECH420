# MECH420 course calendar — the ONLY file you need to edit.
#
# Every entry here appears on the website's Calendar page AND in the
# Outlook / phone calendar feed (calendar.ics). Commit and push; GitHub Pages
# rebuilds in a minute or two. Outlook refreshes subscribed calendars on its
# own schedule (usually within a few hours).
#
# Fields
#   title     (required)  short name shown on the calendar
#   date      (required)  YYYY-MM-DD
#   type      (required)  one of: project, homework, quiz, exam
#   start/end (optional)  24-hour "HH:MM" Beirut time; leave out for an all-day item
#   location  (optional)
#   details   (optional)  one line; avoid line breaks
#   link      (optional)  URL to the handout, submission page, etc.
#
# Keep a title+date+type combination unique: it identifies the event in
# students' calendars, so changing the date of an existing item moves it.

