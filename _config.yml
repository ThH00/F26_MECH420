    url: /practice.html
    match: /practice.html
  - label: Policies
    url: /policies.html
    match: /policies.html
  - label: Resources
    url: /resources.html
    match: /resources.html
  - label: Gradescope
    url: https://www.gradescope.com/courses/1370072
    external: true
